## =============================================================
## DocuVector Lite — Configuração Alembic
##
## DATABASE_URL é lida em runtime de docuvector.config.settings,
## NÃO deste arquivo (por isso `sqlalchemy.url` fica vazio).
##
## Sem post_write_hooks: formatação de migrations geradas roda
## via `just format` manualmente, evitando heurística de AV em
## hooks que invocam subprocess.
## =============================================================

[alembic]
script_location = migrations
prepend_sys_path = . src
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
