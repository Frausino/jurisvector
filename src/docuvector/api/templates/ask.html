{% extends "base.html" %}
{% block title %}Consulta · DocuVector Lite{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
  <div class="mb-6">
    <h1 class="text-2xl font-semibold text-slate-900">Consulta jurídica</h1>
    <p class="text-sm text-slate-500 mt-1">
      Pergunte sobre o conteúdo dos seus documentos. As respostas citam as fontes.
    </p>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-5 mb-6">
    <form hx-post="/app/ask"
          hx-target="#answer-box"
          hx-swap="innerHTML"
          hx-indicator="#ask-spinner"
          class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Pergunta</label>
        <textarea name="query" required rows="3"
                  class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none"
                  placeholder="Qual o prazo de notificação prévia para rescisão do contrato?"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Modelo de embedding</label>
          <select name="embedding_provider"
                  class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
            {% for provider in embedding_providers %}
            <option value="{{ provider }}">{{ provider }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Modelo de linguagem</label>
          <select name="llm_provider"
                  class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
            {% for provider in llm_providers %}
            <option value="{{ provider }}" {% if provider == default_llm %}selected{% endif %}>
              {{ provider }}{% if provider == default_llm %} (padrão){% endif %}
            </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <button type="submit"
              class="bg-blue-600 text-white px-6 py-2 rounded font-medium hover:bg-blue-700 transition">
        <span id="ask-spinner" class="htmx-indicator">Consultando...</span>
        <span class="[.htmx-request_&]:hidden">Consultar</span>
      </button>
    </form>
  </div>

  <div id="answer-box"></div>
</div>
{% endblock %}
