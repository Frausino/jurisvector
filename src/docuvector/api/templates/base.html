<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JurisVector{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            juris: {
              50:  '#f0f4ff',
              100: '#e0e9ff',
              200: '#c7d7fe',
              300: '#a5bafd',
              400: '#8193f8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  {% if user %}
  <header class="bg-gradient-to-r from-juris-900 to-juris-800 text-white shadow-lg border-b border-juris-700 z-10">
    <nav class="max-w-screen-xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <a href="/app/chat" class="flex items-center gap-2.5 font-bold text-base tracking-tight">
        <div class="w-7 h-7 rounded bg-white/20 flex items-center justify-center text-white font-serif text-sm">§</div>
        <span>JurisVector</span>
        <span class="text-juris-300 text-xs font-normal hidden sm:inline">· RAG Jurídico</span>
      </a>

      <div class="flex items-center gap-1 text-sm">
        <a href="/app/chat"
           class="px-3 py-1.5 rounded-md transition-all duration-150
                  {% if active_page == 'chat' %}bg-white/20 text-white font-medium{% else %}text-juris-200 hover:bg-white/10{% endif %}">
          Consulta
        </a>
        <a href="/app/dashboard"
           class="px-3 py-1.5 rounded-md transition-all duration-150
                  {% if active_page == 'dashboard' %}bg-white/20 text-white font-medium{% else %}text-juris-200 hover:bg-white/10{% endif %}">
          Métricas
        </a>
        {% if user.role.value == 'admin' %}
        <a href="/app/admin"
           class="px-3 py-1.5 rounded-md transition-all duration-150
                  {% if active_page == 'admin' %}bg-amber-400/30 text-amber-200 font-medium{% else %}text-amber-300 hover:bg-amber-400/20{% endif %}">
          Admin
        </a>
        {% endif %}
        <div class="mx-2 h-4 w-px bg-white/20"></div>
        <span class="text-juris-300 text-xs hidden md:inline max-w-[150px] truncate">{{ user.email }}</span>
        <a href="/logout"
           class="ml-1 px-3 py-1.5 rounded-md text-juris-200 hover:bg-red-500/20 hover:text-red-200 transition-all duration-150 text-xs">
          Sair
        </a>
      </div>
    </nav>
  </header>
  {% endif %}

  <main class="flex-1 flex flex-col min-h-0">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
