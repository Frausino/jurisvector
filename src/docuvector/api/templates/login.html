{% extends "base.html" %}
{% block title %}Entrar · DocuVector Lite{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-4xl text-blue-600 font-serif mb-2">§</div>
      <h1 class="text-2xl font-semibold text-slate-900">DocuVector Lite</h1>
      <p class="text-sm text-slate-500 mt-1">Consulta inteligente de documentos jurídicos</p>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6">
      {% if error %}
      <div class="mb-4 px-4 py-3 rounded bg-red-50 border border-red-200 text-red-700 text-sm">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" name="email" required autofocus
                 class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                 placeholder="advogado@escritorio.com.br">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <input type="password" name="password" required
                 class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                 placeholder="••••••••">
        </div>
        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 transition">
          Entrar
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-slate-500 mt-4">
      Não tem conta?
      <a href="/register" class="text-blue-600 hover:underline">Cadastre-se</a>
    </p>
  </div>
</div>
{% endblock %}
