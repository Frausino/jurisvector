{% extends "base.html" %}
{% block title %}Admin · DocuVector Lite{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 py-8">

  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Painel administrativo</h1>
      <p class="text-sm text-slate-500 mt-1">{{ total_users }} usuário{{ 's' if total_users != 1 else '' }} no sistema.</p>
    </div>
    <span class="text-xs px-3 py-1 rounded-full bg-amber-100 text-amber-700 font-medium">admin</span>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Criar novo usuário -->
    <div class="lg:col-span-1">
      <div class="bg-white rounded-lg border border-slate-200 p-5">
        <h2 class="font-medium text-slate-900 mb-4">Criar usuário</h2>
        <form hx-post="/app/admin/users/create"
              hx-target="#user-list"
              hx-swap="innerHTML"
              class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Email</label>
            <input type="email" name="email" required
                   class="w-full px-3 py-2 text-sm border border-slate-300 rounded focus:ring-2
                          focus:ring-blue-500 focus:border-blue-500 outline-none"
                   placeholder="usuario@exemplo.com">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Senha</label>
            <input type="password" name="password" required minlength="12"
                   class="w-full px-3 py-2 text-sm border border-slate-300 rounded focus:ring-2
                          focus:ring-blue-500 focus:border-blue-500 outline-none"
                   placeholder="mín. 12 caracteres">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Papel</label>
            <select name="role"
                    class="w-full px-3 py-2 text-sm border border-slate-300 rounded">
              {% for role in roles %}
              <option value="{{ role }}">{{ role }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit"
                  class="w-full bg-blue-600 text-white py-2 rounded text-sm font-medium hover:bg-blue-700 transition">
            Criar usuário
          </button>
        </form>
      </div>
    </div>

    <!-- Lista de usuários -->
    <div class="lg:col-span-2">
      <div id="user-list">
        {% include "partials/admin_user_list.html" %}
      </div>
    </div>

  </div>
</div>
{% endblock %}
