[project]
name = "docuvector-lite"
version = "0.1.0"
description = "Sistema RAG com compressão observável de embeddings e benchmark de provedores."
authors = [{ name = "Davi Rosa F.", email = "davi.rosa@sempreceub.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
keywords = ["rag", "embeddings", "compression", "fastapi", "education"]

dependencies = [
    # Validação (núcleo, sem FastAPI)
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    # Persistência relacional
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    # Segurança
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt<4.1",  # passlib 1.7.x trava em bcrypt >= 4.1 (atributo __about__ removido)
    "python-jose[cryptography]>=3.3,<4.0",
    # Logging
    "structlog>=24.4,<25.0",
    # Numérico e compressão
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.13,<2.0",
    # Vector store
    "chromadb>=0.5,<1.0",
    # Embeddings (linha 5.x; mitiga CVEs da linha 4.x)
    "sentence-transformers>=5.0.0,<6.0",
    "transformers>=5.0.0,<6.0",
    "openai>=1.40,<2.0",
    # Extração de documentos
    "pypdf>=6.10.2,<7.0",
    # Utilidades
    "httpx>=0.27,<0.30",
    "python-dotenv>=1.0,<2.0",
    "aiohttp>=3.14.0",
    "slowapi>=0.1.9",
    "limits>=5.8.0",
    "python-multipart>=0.0.29",
    "deprecated>=1.3.1",
]

[project.optional-dependencies]
## ---------------------------------------------------------------
## Grupo 'api': camada FastAPI isolada.
##
## Motivo da separação:
## pip-audit reportou MAL-2026-4750 sobre fastapi 0.136.3 sem advisory
## público detalhado disponível para análise (provável falso positivo
## de classificador automático, ou advisory ainda não indexado em OSV).
##
## Decisão documentada (ver SECURITY_THREAT_MODEL.md seção 13):
##   1. Mantemos 0.136.3 como versão estável recomendada pelo upstream.
##   2. Isolamos em optional para manter o core importável sem rede.
##   3. Mitigação compensatória: app roda em localhost, sem exposição.
##   4. Monitoramento contínuo via pip-audit no CI (allowlist abaixo).
## ---------------------------------------------------------------
api = [
    "fastapi==0.136.3",
    "starlette>=0.49.1,<1.2",
    "uvicorn[standard]>=0.30,<0.35",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9,<0.2",
    "jinja2>=3.1,<4.0",
]


[dependency-groups]
dev = [
    # Testes
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-asyncio>=1.0,<2.0",
    "hypothesis>=6.110,<7.0",
    # Lint, formatação, tipagem
    "ruff>=0.6,<0.10",
    "mypy>=1.11,<2.0",
    "types-passlib>=1.7",
    "types-python-jose>=3.3",
    # Segurança
    "bandit[toml]>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "detect-secrets>=1.5,<2.0",
    # SBOM
    "cyclonedx-bom>=4.4,<7.0",
    # Pre-commit
    "pre-commit>=3.8,<5.0",
    "scipy-stubs>=1.17.1.5",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
seed-admin = "scripts.seed_admin:main"

[project.urls]
Repository = "https://github.com/Frausino/docuvector-lite"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docuvector"]

# =============================================================
# Ruff (lint + format)
# =============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["migrations", "data_base", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "PL",   # pylint
    "TRY",  # tryceratops
    "RUF",  # ruff-specific
    "PD",   # pandas-vet (PD901 para barrar nome 'df')
]
ignore = [
    "S101",   # assert em testes é permitido
    "PLR0913", # muitos argumentos em construtor de use case é aceitável (DI)
    "TRY003", # mensagens longas em exceções customizadas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR2004", "PLR0915"]
# conftest faz imports lazy intencionais: _set_test_environment() precisa
# rodar antes de qualquer import de `docuvector` para que Settings valide
# variáveis de ambiente já populadas. Ver decisões arq. (2) no conftest.
"tests/conftest.py" = ["S105", "S106", "PLR2004", "PLR0915", "PLC0415"]
"scripts/**" = ["T201"]  # print() permitido em scripts CLI
"src/docuvector/api/routers/*.py" = ["B008"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# =============================================================
# Mypy (tipagem estrita)
# =============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "data_base/"]

[[tool.mypy.overrides]]
# Bibliotecas externas sem stubs publicados.
# Conforme imports forem aparecendo nas Sprints 2 a 4, este bloco recebe
# os módulos correspondentes (chromadb, sentence_transformers, pypdf, etc).
module = [
    "slowapi.*",
    "openai.*",
    "chromadb.*",
    "sentence_transformers.*",
    "pypdf.*",
    "sklearn.*",
]
ignore_missing_imports = true

# =============================================================
# Bandit (SAST)
# =============================================================
[tool.bandit]
targets = ["src"]
skips = ["B101"]  # assert
exclude_dirs = ["tests", "migrations", "data_base"]

# =============================================================
# Pytest
# =============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=src/docuvector",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
markers = [
    "unit: testes unitários puros (sem I/O)",
    "integration: testes de integração com banco e/ou Chroma",
    "slow: testes com tempo de execução acima de 1 segundo",
]

# =============================================================
# Coverage
# =============================================================
[tool.coverage.run]
branch = true
source = ["src/docuvector"]
omit = ["src/docuvector/main.py", "src/docuvector/scripts/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
show_missing = true
skip_covered = false


[tool.pip-audit]
ignore-vulns = [
  "MAL-2026-4750", # fastapi 0.136.3: aceito temporariamente; revisar quando houver versão compatível/testada.
  "PYSEC-2026-196",
]
